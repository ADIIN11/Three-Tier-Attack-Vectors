<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign_In</title>
    <link rel="stylesheet" href="/Sign_In.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <canvas id="leaves-canvas"></canvas>

    <header>
        <img src="/assets/logo-notext.png" alt="" onclick="window.location.href='/Home';" class="logo">
        <h1>ESTHER GATE</h1>
    </header>
       
    <div class="Form">
        <form id="form-id">
            <h2>Sign-In</h2>
            <br>
            <input type="text" placeholder="Username or Email" id="username-email-inpt">
            <br>
            <input type="password" placeholder="password" id="password-inpt">
            <br>
            <div id="captcha-box">
                <img src="" alt="captcha" id="captcha-img" class="captcha-img">
                <br>
                <div class="captcha-controls">
                    <input class="captcha-input" type="text" placeholder="captcha" id="captcha-inpt" autocomplete="off">
                    <button type="button" id="reload-captcha-btn" class="captcha-btn">
                        <img src="/assets/reload-icon.png" alt="icon" class="reload-icon">
                    </button>
                </div>
            </div>
            <button type="submit" class="form-btn">Submit</button>
            <h4 class="form-text">------or------</h4>
            <button type="button" class="form-btn" onclick="window.location.href='/Auth/Sign_Up';">Sign-Up</button>
            <p id="msg-id" class="msg-para"></p>
        </form> 
    </div>

    <script src="/Sign_In.js"></script>
</body>
</html>
